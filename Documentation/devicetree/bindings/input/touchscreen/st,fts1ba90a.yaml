%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,fts1ba90a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FTS1BA90A touchscreen controller

maintainers:
  - SputnikRocket <108942763+SputnikRocket@users.noreply.github.com>

description:
  Capacitive touchscreen controller with Samsung's firmware, as used in the
  Samsung Galaxy Tab S6. It is not compatible with the controllers handled
  by st,stmfts.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: st,fts1ba90a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  avdd-supply:
    description: Analog supply (3.3V)

  vdd-supply:
    description: Digital supply (1.8V)

unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - avdd-supply
  - vdd-supply
  - touchscreen-size-x
  - touchscreen-size-y

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@49 {
            compatible = "st,fts1ba90a";
            reg = <0x49>;
            interrupt-parent = <&tlmm>;
            interrupts = <87 IRQ_TYPE_LEVEL_LOW>;
            avdd-supply = <&vreg_l17a_3p3>;
            vdd-supply = <&vreg_l14a_1p8>;
            touchscreen-size-x = <1600>;
            touchscreen-size-y = <2560>;
        };
    };
