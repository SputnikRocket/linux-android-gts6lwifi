%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,amsa05rb06.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung AMSA05RB06 dual-DSI AMOLED panel

maintainers:
  - SputnikRocket <108942763+SputnikRocket@users.noreply.github.com>

description:
  The Samsung AMSA05RB06 is a 10.5" 2560x1600 command mode AMOLED panel with
  an Anapass ANA38401 display driver IC, driven over two DSI links that each
  carry one 1280x1600 half. It is used in the Samsung Galaxy Tab S6.

allOf:
  - $ref: panel-common-dual.yaml#

properties:
  compatible:
    const: samsung,amsa05rb06

  reg:
    maxItems: 1

  vddio-supply:
    description: 1.8V I/O supply

  vdd-supply:
    description: Panel power supply

  reset-gpios:
    maxItems: 1
    description: Reset line, active low

  tcon-rdy-gpios:
    maxItems: 1
    description:
      TCON_RDY output of the display driver IC, high once it is ready after
      a reset.

required:
  - compatible
  - reg
  - vddio-supply
  - vdd-supply
  - reset-gpios
  - ports

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,amsa05rb06";
            reg = <0>;

            vddio-supply = <&vreg_l14a_1p8>;
            vdd-supply = <&panel_vdd>;
            reset-gpios = <&tlmm 59 GPIO_ACTIVE_LOW>;
            tcon-rdy-gpios = <&tlmm 140 GPIO_ACTIVE_HIGH>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    panel_in_0: endpoint {
                        remote-endpoint = <&mdss_dsi0_out>;
                    };
                };

                port@1 {
                    reg = <1>;
                    panel_in_1: endpoint {
                        remote-endpoint = <&mdss_dsi1_out>;
                    };
                };
            };
        };
    };

...
